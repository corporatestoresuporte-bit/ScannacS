[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scannacs"
version = "0.2.0"
description = "ScannacS — auditoria de segurança dos próprios sites, domínios e VPS."
requires-python = ">=3.11"
dependencies = []   # base sem dependências externas; scanners/IA vêm depois

[project.scripts]
agente = "agente.cli:main"
scan = "agente.cli:scan_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agente = ["data/**/*", "data/**/*.*"]
