[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-vulnerabilidades"
version = "0.1.0"
description = "Agente de auditoria de segurança dos próprios sites, domínios e VPS."
requires-python = ">=3.11"
dependencies = []   # base sem dependências externas; scanners/IA vêm depois

[project.scripts]
agente = "agente.cli:main"
scan = "agente.cli:scan_main"

[tool.setuptools.packages.find]
where = ["src"]
