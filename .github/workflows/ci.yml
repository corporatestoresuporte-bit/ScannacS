name: testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testes (stdlib, sem dependências)
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  instalacao:
    needs: unittest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar a partir do artefato (não editável)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip show scannacs
      - name: doctor instalado em caminho com espaço e acento
        shell: bash
        run: |
          D="$RUNNER_TEMP/Auditoria Ação ScannacS"
          mkdir -p "$D"
          AGENTE_HOME="$D" python -m agente doctor
          AGENTE_HOME="$D" python -m agente doctor | grep -q "instalado"
          AGENTE_HOME="$D" python -m agente doctor | grep -q "Wordlist encontrada : True"
      - name: fluxo básico da CLI instalada (sem rede ofensiva)
        shell: bash
        run: |
          D="$RUNNER_TEMP/Auditoria Ação ScannacS"
          AGENTE_HOME="$D" python -m agente scope add-target --type url --value https://exemplo-proprio.example --tests all
          AGENTE_HOME="$D" python -m agente tools
          AGENTE_HOME="$D" python -m agente audit plan
      - name: init-workspace do pacote instalado (fase-2 do Claude)
        shell: bash
        run: |
          WS="$RUNNER_TEMP/Ação Workspace"
          python -m agente init-workspace "$WS"
          test -f "$WS/CLAUDE.md" || { echo "FALHOU: sem CLAUDE.md"; exit 1; }
          test -f "$WS/.claude/settings.json" || { echo "FALHOU: sem .claude/settings.json"; exit 1; }
          test -f "$WS/.claude/agents/validador-achados.md" || { echo "FALHOU: sem agente"; exit 1; }
          test -d "$WS/.claude/skills" || { echo "FALHOU: sem skills"; exit 1; }
          echo "OK: workspace do Claude materializado a partir do wheel."
      - name: app web sobe a partir do wheel (headless)
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from agente import webui
          httpd = webui.serve(port=0, open_browser=False, block=False)
          base = f"http://127.0.0.1:{httpd.server_address[1]}"
          try:
              assert urllib.request.urlopen(base + "/", timeout=5).status == 200
              st = json.loads(urllib.request.urlopen(base + "/api/state", timeout=5).read())
              assert "phase" in st, st
              dp = json.loads(urllib.request.urlopen(base + "/api/deps", timeout=5).read())
              assert "tools" in dp, dp
              print("OK: app web servindo index + /api/state + /api/deps a partir do wheel")
          finally:
              httpd.shutdown(); httpd.server_close()
          PY

  toolprep-lab:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Preparar ambiente REAL no Linux - instala e valida semgrep + trivy"
        shell: bash
        run: |
          python -m pip install --quiet .
          python - <<'PY'
          from agente import toolprep
          info = toolprep.os_info()
          assert info["os"] == "linux", info
          print("SO detectado:", info)
          res = toolprep.prepare({"code"}, {}, only=["semgrep", "trivy"])
          r = res["results"]
          print("resultados:", {k: (v["ok"], v.get("state")) for k, v in r.items()})
          assert r["semgrep"]["ok"], r["semgrep"]      # pip
          assert r["trivy"]["ok"], r["trivy"]          # binário oficial baixado
          # verde = executa: confirma no diagnóstico final
          d = {t["key"]: t for t in res["diag"]["tools"]}
          assert d["semgrep"]["green"] and d["semgrep"]["state"] == "funcional"
          assert d["trivy"]["green"] and d["trivy"]["state"] == "funcional"
          print("OK: Preparar ambiente instalou e deixou semgrep+trivy FUNCIONAIS no Linux")
          PY

  semgrep-lab:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAST real (Semgrep) contra laboratório vuln/seguro
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet semgrep
          semgrep --version
          LAB="$RUNNER_TEMP/sast-lab"; mkdir -p "$LAB"
          printf 'user = input()\neval(user)\n' > "$LAB/vuln.py"
          printf 'x = 1 + 1\nprint(x)\n' > "$LAB/safe.py"
          printf 'rules:\n  - id: eval-detectado\n    languages: [python]\n    severity: ERROR\n    message: uso de eval\n    pattern: eval(...)\n' > "$LAB/rule.yml"
          OUT=$(python -m agente sast "$LAB" --config "$LAB/rule.yml")
          echo "$OUT"
          echo "$OUT" | grep -q "vuln.py:2" || { echo "FALHOU: nao detectou vuln.py:2"; exit 1; }
          if echo "$OUT" | grep -q "safe.py"; then echo "FALHOU: falso-positivo em safe.py"; exit 1; fi
          echo "OK: Semgrep detectou o caso vulneravel e ignorou o seguro."

  trivy-lab:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: IaC real (Trivy) contra Dockerfile inseguro
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          trivy --version
          LAB="$RUNNER_TEMP/iac-lab"; mkdir -p "$LAB"
          printf 'FROM alpine:3.19\nRUN echo oi\n' > "$LAB/Dockerfile"
          OUT=$(python -m agente iac "$LAB")
          echo "$OUT"
          echo "$OUT" | grep -q "Trivy IaC" || { echo "FALHOU: Trivy nao apontou misconfig"; exit 1; }
          echo "OK: Trivy apontou misconfig de IaC no laboratorio."

  zap-lab:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DAST real (ZAP baseline) contra servidor local sem headers
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          echo '<html><body>lab</body></html>' > "$RUNNER_TEMP/index.html"
          nohup python -m http.server 8000 --directory "$RUNNER_TEMP" >/dev/null 2>&1 &
          sleep 2
          mkdir -p "$RUNNER_TEMP/zap"; chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy zap-baseline.py \
            -t http://localhost:8000 -J report.json -I || true
          test -f "$RUNNER_TEMP/zap/report.json" || { echo "FALHOU: ZAP sem report"; exit 1; }
          OUT=$(python -m agente zap-import "$RUNNER_TEMP/zap/report.json" --target http://localhost:8000)
          echo "$OUT"
          echo "$OUT" | grep -q "ZAP:" || { echo "FALHOU: nenhum alerta ZAP"; exit 1; }
          echo "OK: ZAP baseline detectou alertas no laboratorio local."
